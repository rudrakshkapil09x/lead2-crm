name: Deploy EC2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test && npm run test:integration && npm run build
      - name: Require production dependency audit
        run: npm audit --omit=dev --audit-level=high
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH host
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Package source
        run: tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=.env --exclude=backups -czf /tmp/lead2.tgz .
      - name: Upload and deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          test -n "$EC2_HOST" && test -n "$EC2_USER"
          scp /tmp/lead2.tgz "$EC2_USER@$EC2_HOST:/tmp/lead2.tgz"
          ssh "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/lead2-crm
          test -f .env || { echo 'Create .env on the host before first deployment'; exit 1; }
          tar -xzf /tmp/lead2.tgz
          bash scripts/aws-start.sh
          REMOTE
