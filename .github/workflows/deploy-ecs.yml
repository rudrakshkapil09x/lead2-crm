name: Deploy to AWS ECS (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # for OIDC auth with AWS

env:
  AWS_REGION: ap-south-1

jobs:
  # ─── 1. Verify ──────────────────────────────────────────────────────────────
  verify:
    name: Lint, test & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Production dependency audit (blocks on high severity)
        run: npm audit --omit=dev --audit-level=high

  # ─── 2. Build & push Docker images to ECR ───────────────────────────────────
  build:
    name: Build & push to ECR
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      api-image: ${{ steps.meta-api.outputs.image }}
      web-image: ${{ steps.meta-web.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta-api
        run: echo "image=${{ steps.ecr.outputs.registry }}/lead2-crm-production-api:${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Set web image tag
        id: meta-web
        run: echo "image=${{ steps.ecr.outputs.registry }}/lead2-crm-production-web:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile -t ${{ steps.meta-api.outputs.image }} .
          docker push ${{ steps.meta-api.outputs.image }}

      - name: Build and push web image
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg API_INTERNAL_URL=http://lead2-crm-production-api.lead2-crm-production.local:4000 \
            -t ${{ steps.meta-web.outputs.image }} .
          docker push ${{ steps.meta-web.outputs.image }}

  # ─── 3. Run DB migrations ────────────────────────────────────────────────────
  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Run migrations via an ECS one-off task (uses the API image which has psql)
      - name: Run migrations via ECS RunTask
        run: |
          DB_URL=$(aws secretsmanager get-secret-value --secret-id "${{ secrets.SECRETS_ARN }}" --query 'SecretString' | jq -r '. | fromjson | .DATABASE_URL')
          aws ecs run-task \
            --cluster lead2-crm-production-cluster \
            --task-definition lead2-crm-production-api \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.ECS_SG_ID }}],assignPublicIp=DISABLED}" \
            --overrides "containerOverrides=[{name=api,command=[sh,-c,\"psql \$DATABASE_URL --single-transaction < /app/apps/api/db/migrations/004-recurring-tasks.sql && psql \$DATABASE_URL --single-transaction < /app/apps/api/db/migrations/005-mfa.sql && psql \$DATABASE_URL --single-transaction < /app/apps/api/db/migrations/006-webhooks.sql && psql \$DATABASE_URL --single-transaction < /app/apps/api/db/migrations/007-tags.sql && echo 'Migrations done'\"],environment=[{name=DATABASE_URL,value=$DB_URL},{name=DATABASE_SSL,value=true}]}]" \
            --wait-until stopped

  # ─── 4. Deploy to ECS ────────────────────────────────────────────────────────
  deploy:
    name: Update ECS services
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update API service (force new deployment)
        run: |
          aws ecs update-service \
            --cluster lead2-crm-production-cluster \
            --service lead2-crm-production-api \
            --force-new-deployment \
            --task-definition lead2-crm-production-api

      - name: Update web service (force new deployment)
        run: |
          aws ecs update-service \
            --cluster lead2-crm-production-cluster \
            --service lead2-crm-production-web \
            --force-new-deployment \
            --task-definition lead2-crm-production-web

      - name: Wait for API service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster lead2-crm-production-cluster \
            --services lead2-crm-production-api

      - name: Wait for web service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster lead2-crm-production-cluster \
            --services lead2-crm-production-web

      - name: Deployment complete
        run: echo "✅ Lead2 CRM deployed successfully to https://${{ secrets.DOMAIN_NAME }}"
