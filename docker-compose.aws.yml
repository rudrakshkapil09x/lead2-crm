services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:?Required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/db/000-app-role.sh:/docker-entrypoint-initdb.d/000-app-role.sh:ro
      - ./apps/api/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./apps/api/db/migrations/003-lead2.sql:/docker-entrypoint-initdb.d/003-lead2.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_owner -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://crm_app:${CRM_APP_PASSWORD}@postgres:5432/crm
      PORT: 4000
      COOKIE_SECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on: [api]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set your public domain, e.g. crm.example.com}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
volumes:
  pgdata:
  caddy_data:
  caddy_config:
